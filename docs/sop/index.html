function openDetail(id){const node=nodeData.find(n=>n.id===id);detailOrigin=document.querySelector(`[data-node="${id}"]`);document.querySelectorAll('.node').forEach(e=>e.classList.toggle('selected',e===detailOrigin));$('detail-title').textContent=node.title;$('detail-text').textContent=node.text;$('detail-source').textContent=`依据：SOP ${node.source}`;$('detail-list').replaceChildren(...node.rules.map(text=>{const li=document.createElement('li');li.textContent=text;return li;}));$('inspector').classList.add('open');}

const canvas=$('canvas'),plane=$('plane');let scale=1,offsetX=0,offsetY=0,autoFit=true,drag=null,wasDrag=false;
function paint(){plane.style.transform=`translate(${offsetX}px,${offsetY}px) scale(${scale})`;$('zoom').textContent=`${Math.round(scale*100)}%`;}
function fit(){const rect=canvas.getBoundingClientRect();scale=Math.min((rect.width-28)/1540,(rect.height-24)/960);offsetX=(rect.width-1540*scale)/2;offsetY=(rect.height-960*scale)/2;autoFit=true;paint();}
function zoomTo(next,x=canvas.clientWidth/2,y=canvas.clientHeight/2){next=Math.max(.18,Math.min(2.5,next));offsetX=x-(x-offsetX)*next/scale;offsetY=y-(y-offsetY)*next/scale;scale=next;autoFit=false;paint();}
$('fit').addEventListener('click',fit);function focusLane(x){const r=canvas.getBoundingClientRect();scale=Math.min((r.width-28)/735,(r.height-24)/525);offsetX=(r.width-735*scale)/2-x*scale;offsetY=(r.height-525*scale)/2-290*scale;autoFit=false;closeDetail();paint();}$('focus-gen').addEventListener('click',()=>focusLane(25));$('focus-judge').addEventListener('click',()=>focusLane(780));$('plus').addEventListener('click',()=>zoomTo(scale*1.2));$('minus').addEventListener('click',()=>zoomTo(scale/1.2));
canvas.addEventListener('wheel',event=>{if(event.target.closest('.inspector'))return;event.preventDefault();const rect=canvas.getBoundingClientRect();zoomTo(scale*Math.exp(-event.deltaY*.0015),event.clientX-rect.left,event.clientY-rect.top);},{passive:false});
canvas.addEventListener('pointerdown',event=>{if(event.target.closest('.inspector')||event.button!==0)return;wasDrag=false;drag={x:event.clientX,y:event.clientY,startX:offsetX,startY:offsetY};});
canvas.addEventListener('pointermove',event=>{if(!drag)return;const dx=event.clientX-drag.x,dy=event.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4){wasDrag=true;autoFit=false;canvas.classList.add('dragging');canvas.setPointerCapture(event.pointerId);offsetX=drag.startX+dx;offsetY=drag.startY+dy;paint();}});
function endDrag(){drag=null;canvas.classList.remove('dragging');}canvas.addEventListener('pointerup',endDrag);canvas.addEventListener('pointercancel',endDrag);window.addEventListener('pointerup',endDrag);
new ResizeObserver(()=>{if(autoFit)fit();}).observe(canvas);
